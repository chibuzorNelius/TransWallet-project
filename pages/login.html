<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Trans Wallet</title>
    <link rel="icon" type="image/png" href="../images/transwallet-logo-removebg-preview.png" />
    <!--
    ========================================================
    DEVELOPER & AI CODING SAFETY GUIDELINES
    ========================================================
    AUTH LAYOUT:
    This is an onboarding/authentication view. Shared navigation sidebars and 
    mobile bottom bars are automatically excluded from this view via the 'app-auth' 
    body class. Do NOT add layout navigation here.

    AI DEVELOPMENT NOTICE:
    Do NOT rewrite, restructure, or modify unrelated files or change the visual 
    variables in variables.css. All development must respect local page isolation.
    ========================================================
    -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css" />
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/app.js"></script>
  </head>
  <body class="app-auth">
    <main class="container">
      <section class="auth-card">
        <div class="auth-brand">Trans<span>Wallet</span></div>
        <p class="auth-eyebrow">Secure access</p>
        <h1>Welcome back</h1>
        <p class="auth-copy">Sign in to see your balance and wallet activity.</p>
        <div id="authAlert" class="auth-alert" role="alert"></div>
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="identifier">Email, phone, or username</label>
            <input id="identifier" name="identifier" type="text" autocomplete="username" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password" />
          </div>
          <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
        </form>
        <p class="auth-switch">New to TransWallet? <a href="register.html">Create an account</a></p>
      </section>
    </main>
  </body>
</html>
