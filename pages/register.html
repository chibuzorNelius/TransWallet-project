<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Trans Wallet</title>
    <link rel="icon" type="image/png" href="../images/transwallet-logo-removebg-preview.png" />
    <!--
    ========================================================
    DEVELOPER & AI CODING SAFETY GUIDELINES
    ========================================================
    AUTH LAYOUT:
    This is an onboarding/authentication view. Shared navigation sidebars and 
    mobile bottom bars are automatically excluded from this view via the 'app-auth' 
    body class. Do NOT add layout navigation here.

    AI DEVELOPMENT NOTICE:
    Do NOT rewrite, restructure, or modify unrelated files or change the visual 
    variables in variables.css. All development must respect local page isolation.
    ========================================================
    -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css" />
    <script defer src="../js/country-flags.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/app.js"></script>
  </head>
  <body class="app-auth">
    <main class="container">
      <section class="auth-card auth-card-wide">
        <div class="auth-brand">Trans<span>Wallet</span></div>
        <p class="auth-eyebrow">Start your wallet journey</p>
        <h1>Create your account</h1>
        <p class="auth-copy">Open a personal wallet and receive a ₦100,000 welcome bonus.</p>
        <div id="authAlert" class="auth-alert" role="alert"></div>
        <form id="registerForm" class="auth-form register-form">
          <div class="form-group">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" required placeholder="Alex Morgan" />
          </div>
          <div class="form-group"><label for="username">Username</label><input id="username" name="username" type="text" required placeholder="alexmorgan" /></div>
          <div class="form-group">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" name="email" type="email" required placeholder="alex@company.com" />
          </div>
          <div class="form-group"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required placeholder="08012345678" /></div>
          <div class="form-group">
            <label for="region">Region</label>
            <div class="region-control">
              <img id="region-flag" class="region-flag" src="../images/nigeriaFlag.png" alt="Nigeria flag" />
              <select id="region" name="region" required>
                <option value="NG">Nigeria</option>
                <option value="US">United States</option>
                <option value="GB">United Kingdom</option>
                <option value="CA">Canada</option>
                <option value="EU">European Union</option>
                <option value="CN">China</option>
                <option value="JP">Japan</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="registerPassword">Password</label>
            <input id="registerPassword" name="password" type="password" minlength="6" required placeholder="At least 6 characters" />
          </div>
          <div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required placeholder="Repeat your password" /></div>
          <div class="register-grid"><div class="form-group"><label for="transactionPin">Transaction PIN</label><input id="transactionPin" name="transactionPin" type="password" inputmode="numeric" minlength="4" maxlength="6" required placeholder="4-6 digits" /></div><div class="form-group"><label for="confirmPin">Confirm PIN</label><input id="confirmPin" name="confirmPin" type="password" inputmode="numeric" minlength="4" maxlength="6" required placeholder="Repeat PIN" /></div></div>
          <label class="policy-check"><input type="checkbox" name="policy" required /> <span>I agree to the Terms of Service and Privacy Policy.</span></label>
          <button class="btn btn-primary auth-submit" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      </section>
    </main>
  </body>
</html>
