<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Trans Wallet</title>
    <link rel="stylesheet" href="../css/global.css" />
    <script defer src="../js/auth.js"></script>
  </head>
  <body>
    <main class="container">
      <section class="card" style="max-width: 560px; margin: 2rem auto;">
        <h1>Create your account</h1>
        <p>TODO: Build registration form and simulated account creation.</p>
        <form class="u-mt-3">
          <div class="form-group">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" placeholder="Alex Morgan" />
          </div>
          <div class="form-group">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" name="registerEmail" type="email" placeholder="alex@company.com" />
          </div>
          <div class="form-group">
            <label for="registerPassword">Password</label>
            <input id="registerPassword" name="registerPassword" type="password" placeholder="Create a password" />
          </div>
          <button class="btn btn-primary" type="submit">Create Account</button>
        </form>
      </section>
    </main>
  </body>
</html>
