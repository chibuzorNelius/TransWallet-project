<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | Trans Wallet</title>
    <!--
    ========================================================
    DEVELOPER & AI CODING SAFETY GUIDELINES
    ========================================================
    SHARED NAVIGATION:
    Navigation has already been integrated through the shared component system 
    across the required viewports. Do NOT recreate or duplicate navigation here.
    Focus work entirely on the main page content inside <main class="container">.

    GLOBAL STYLING NOTICE:
    The application background, base typography and global colours are already 
    handled by the global stylesheet. Do NOT redefine body background styles here.

    AI DEVELOPMENT NOTICE:
    If you use an AI coding assistant, explicitly tell it that this is a 
    collaborative multi-developer project and identify the specific file/module 
    you are working on. Instruct it NOT to rewrite, restructure, or modify 
    unrelated files.

    PAGE OWNERSHIP:
    This page is assigned to a specific developer. Keep feature-specific HTML, 
    CSS and JavaScript isolated to this page/module unless a shared component 
    is genuinely required.

    RESPONSIVE DESIGN:
    This page must be tested on mobile, tablet and desktop before completion.
    ========================================================
    -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pages/transations.css" />
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/transactions.js"></script>
  </head>
  <body class="app-logged-in">
    <main class="container">
      <section class="transactions-page">
        <header class="transactions-header">
          <div>
            <p class="eyebrow">Account activity</p>
            <h1>Transactions</h1>
          </div>
          <p class="transactions-subtitle">Track your transfers, payments, exchanges and other account activity.</p>
        </header>

        <div class="summary-grid" aria-label="Transaction summary">
          <article class="summary-card">
            <span>Total transactions</span>
            <strong id="summaryTotal">0</strong>
          </article>
          <article class="summary-card success">
            <span>Money in</span>
            <strong id="summaryCredit">₦0.00</strong>
          </article>
          <article class="summary-card danger">
            <span>Money out</span>
            <strong id="summaryDebit">₦0.00</strong>
          </article>
          <article class="summary-card warning">
            <span>Pending</span>
            <strong id="summaryPending">0</strong>
          </article>
        </div>

        <div class="transactions-toolbar">
          <label class="search-field" for="transactionSearch">
            <span class="sr-only">Search transactions</span>
            <input id="transactionSearch" type="search" placeholder="Search transactions" aria-label="Search transactions" />
          </label>

          <div class="filter-group" aria-label="Transaction filters">
            <button class="filter-chip active" type="button" data-filter="all">All</button>
            <button class="filter-chip" type="button" data-filter="credits">Credits</button>
            <button class="filter-chip" type="button" data-filter="debits">Debits</button>
            <button class="filter-chip" type="button" data-filter="pending">Pending</button>
            <button class="filter-chip" type="button" data-filter="completed">Completed</button>
            <button class="filter-chip" type="button" data-filter="failed">Failed</button>
          </div>
        </div>

        <section class="transactions-list" id="transactionGroups" aria-live="polite"></section>

        <div class="transaction-empty hidden" id="transactionEmpty" aria-live="polite">
          <div class="empty-icon">↗</div>
          <h2>No transactions found</h2>
          <p>Try adjusting your search or filters to find the activity you need.</p>
        </div>
      </section>
    </main>
  </body>
</html>
